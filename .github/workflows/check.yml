name: Check release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm run audit:release
      - name: Check committed bundle
        run: git diff --exit-code -- dist/RedflagAutoMute.plugin.js
